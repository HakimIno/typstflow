[package]
name = "typst-bridge"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "0.14.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
calamine = "0.26"
serde-wasm-bindgen = "0.6"
comemo = "0.4"
web-sys = { version = "0.3", features = ["console"] }
typst-assets = "0.14.2"
typst-library = "0.14.2"
typst-svg = "0.14.2"
typst-pdf = "0.14.2"
rstar = "0.12"

[profile.release]
lto = true
opt-level = 'z'
