[package]
name = "typst-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "0.11.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
comemo = "0.4"
typst-assets = "0.11.1"
typst-svg = "0.11.1"
typst-pdf = "0.11.1"

[profile.release]
lto = true
opt-level = 'z'
